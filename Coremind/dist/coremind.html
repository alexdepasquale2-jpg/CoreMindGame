<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Coremind</title>
<meta name="description" content="COREMIND — a single-player biological evolution sandbox. Discover, analyze, extract, design, deploy, adapt.">
<!-- Inline so the page stays a single self-contained bundle (see tools/build.mjs)
     and so no request 404s when it is opened straight off the filesystem. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230f2e26' stroke='%2333e6b0' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2333e6b0'/%3E%3C/svg%3E">
<style>
/* Coremind — mobile-first dark UI. Large touch targets, portrait layout. */
:root{
  --bg:#060b12;
  --panel:#0b141d;
  --panel2:#0f1c27;
  --line:#1c2e3a;
  --fg:#dfeef0;
  --fg-dim:#8aa3ab;
  --accent:#33e6b0;
  --accent-dim:#1c8a6b;
  --warn:#f2a33c;
  --danger:#ef5b5b;
  --biomass:#7ee081;
  --energy:#ffd166;
  --pop:#8ec8ff;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{height:100%;margin:0;overscroll-behavior:none;touch-action:none;}
body{
  background:var(--bg);color:var(--fg);
  font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;position:fixed;inset:0;
}
#app{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:var(--safe-top);}

/* ---- top bar ---- */
#topbar{
  display:flex;align-items:center;gap:10px;padding:8px 10px;
  background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;
  z-index:5;
}
#topbar .stat{display:flex;align-items:center;gap:5px;font-weight:600;font-variant-numeric:tabular-nums;padding:4px 8px;border-radius:8px;background:var(--panel2);}
#topbar .stat i{font-style:normal;font-size:15px;}
#stat-biomass{color:var(--biomass);}
#stat-energy{color:var(--energy);}
#stat-pop{color:var(--pop);}
#btn-speed{margin-left:auto;}

.iconbtn{
  background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;
  min-width:40px;min-height:36px;font-size:16px;line-height:1;cursor:pointer;
}
.iconbtn:active{background:var(--line);}

/* ---- stage / world canvas ---- */
#stage{position:relative;flex:1 1 auto;min-height:0;background:#04080d;overflow:hidden;}
#world-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}

#cam-controls{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:8px;z-index:4;}
.roundbtn{
  width:46px;height:46px;border-radius:50%;background:rgba(11,20,29,.85);
  color:var(--fg);border:1px solid var(--line);font-size:20px;backdrop-filter:blur(2px);
}
.roundbtn:active{background:var(--accent-dim);}

/* Depth switcher: a vertical stack down the left edge, laid out top-to-bottom
   like the strata it selects, so which way is "down" never needs explaining. */
#depth-controls{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:4px;z-index:4;}
.depthbtn{
  width:44px;height:34px;border-radius:7px;background:rgba(11,20,29,.82);
  color:var(--muted);border:1px solid var(--line);font-size:12px;font-weight:600;
  letter-spacing:.4px;backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;
}
.depthbtn.active{color:#08131b;background:var(--accent);border-color:var(--accent);}
.depthbtn:disabled{opacity:.32;}

/* Bottom-right, above the camera buttons: bottom-left belongs to the depth
   strip and bottom-centre to the stratum banner the renderer draws. */
#sanctum-meter{
  position:absolute;right:10px;bottom:178px;z-index:4;font-size:11px;color:var(--muted);
  background:rgba(11,20,29,.85);border:1px solid var(--line);border-radius:7px;padding:5px 8px;
  max-width:150px;pointer-events:none;
}
#sanctum-meter .bar{height:4px;background:rgba(255,255,255,.12);border-radius:2px;margin-top:4px;overflow:hidden;}
#sanctum-meter .bar > i{display:block;height:100%;background:#c88cff;}
#sanctum-meter.secured{color:#e6c8ff;border-color:#8a4fd1;}

#toast-layer{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:6;align-items:center;}
.toast{
  background:rgba(11,20,29,.92);border:1px solid var(--line);border-left:3px solid var(--accent);
  padding:8px 12px;border-radius:8px;max-width:340px;font-size:13px;animation:toastin .18s ease-out;
}
.toast.warn{border-left-color:var(--warn);}
.toast.danger{border-left-color:var(--danger);}
@keyframes toastin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

#selection-panel.card{
  position:absolute;left:10px;top:10px;right:10px;max-width:360px;z-index:5;
}
.card{
  background:rgba(11,20,29,.94);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
}
.hidden{display:none !important;}

/* ---- bottom tabs ---- */
#tabs{display:flex;flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);}
.tab{
  flex:1;padding:11px 4px;background:none;border:none;color:var(--fg-dim);font-weight:700;
  font-size:12.5px;letter-spacing:.04em;position:relative;min-height:44px;
}
.tab.active{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent);}
.badge{
  position:absolute;top:4px;right:calc(50% - 26px);background:var(--accent);color:#04140e;
  border-radius:9px;padding:0 5px;font-size:10px;font-weight:800;
}
.badge.warn{background:var(--warn);}

/* ---- bottom panels ---- */
.panel{display:none;flex:0 0 auto;background:var(--panel);max-height:40vh;overflow-y:auto;padding:8px 10px calc(10px + var(--safe-bottom));}
.panel.active{display:block;}
#selection-summary{color:var(--fg-dim);font-size:12.5px;margin-bottom:8px;}

#directive-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.dirbtn{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--fg);
  padding:10px 2px;font-size:11.5px;font-weight:700;min-height:52px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
}
.dirbtn i{font-style:normal;font-size:18px;}
.dirbtn.active{border-color:var(--accent);color:var(--accent);background:rgba(51,230,176,.08);}
.dirbtn:disabled{opacity:.35;}

/* ---- event feed ---- */
#event-feed{display:flex;flex-direction:column;gap:6px;}
.event-row{
  display:flex;gap:8px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;text-align:left;color:var(--fg);
}
.event-row .ico{font-size:16px;flex:0 0 auto;}
.event-row .body{flex:1;min-width:0;}
.event-row .msg{font-size:12.5px;}
.event-row .time{font-size:10.5px;color:var(--fg-dim);}
.event-row.discovery{border-left:3px solid var(--accent);}
.event-row.death{border-left:3px solid var(--danger);}
.event-row.warn{border-left:3px solid var(--warn);}
.event-empty{color:var(--fg-dim);text-align:center;padding:20px 0;font-size:12.5px;}

/* ---- overlays (designer / inspect / boot) ---- */
.overlay{
  position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;
  padding-top:var(--safe-top);
}
.overlay-head{display:flex;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto;}
.overlay-title{flex:1;text-align:center;font-weight:800;letter-spacing:.06em;font-size:13px;}

/* designer */
#designer-preview{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:10px;background:var(--panel);border-bottom:1px solid var(--line);}
#preview-canvas{background:radial-gradient(circle at 50% 40%,#0f2018,#050a08);border-radius:12px;border:1px solid var(--line);}
#designer-cost{margin-top:6px;font-size:12px;color:var(--fg-dim);}
#designer-cost .ok{color:var(--biomass);}
#designer-cost .bad{color:var(--danger);}

#designer-slots{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;background:var(--panel);border-bottom:1px solid var(--line);}
.slot{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;
}
.slot .cat{font-size:10px;color:var(--fg-dim);letter-spacing:.06em;}
.slot .trait{font-size:12.5px;font-weight:700;margin:4px 0;min-height:16px;}
.slot .trait.empty{color:var(--fg-dim);font-weight:400;}
.slot select{
  width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;
  padding:6px 2px;font-size:11.5px;min-height:34px;
}

#designer-stats{flex:1;overflow-y:auto;padding:10px;}
.statrow{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;}
.statrow .label{width:76px;flex:0 0 auto;color:var(--fg-dim);}
.statrow .bar{flex:1;height:9px;background:var(--panel2);border-radius:5px;overflow:hidden;border:1px solid var(--line);}
.statrow .bar > i{display:block;height:100%;background:var(--accent);}
.statrow .val{width:34px;text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums;}
.statrow .delta{width:36px;flex:0 0 auto;font-size:10.5px;text-align:left;}
.statrow .delta.pos{color:var(--biomass);}
.statrow .delta.neg{color:var(--danger);}

.bigbtn{
  flex:0 0 auto;margin:10px;padding:14px;border-radius:12px;border:none;background:var(--accent);
  color:#04140e;font-weight:800;font-size:14px;letter-spacing:.03em;min-height:50px;
}
.bigbtn:disabled{opacity:.35;}
.bigbtn.secondary{background:var(--panel2);color:var(--fg);border:1px solid var(--line);}

/* designer: conflicts / synergies / saved strains */
#designer-actions{flex:0 0 auto;display:flex;gap:0;padding-bottom:var(--safe-bottom);}
#designer-actions .bigbtn{flex:1;}
#btn-save-design{flex:0 0 38%;}

#designer-combo{flex:0 0 auto;padding:0 10px;background:var(--panel);}
#designer-combo:empty{display:none;}
.combo-note{
  display:flex;gap:6px;align-items:flex-start;font-size:11.5px;padding:6px 8px;border-radius:8px;margin-bottom:6px;
}
.combo-note.synergy{background:rgba(51,230,176,.1);border:1px solid var(--accent-dim);color:var(--accent);}
.combo-note.conflict{background:rgba(239,91,91,.12);border:1px solid var(--danger);color:var(--danger);}

#designer-designs{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line);}
#designer-designs:empty{display:none;}
.strain-chip{
  flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);border-radius:14px;
  padding:7px 12px;font-size:11.5px;color:var(--fg);white-space:nowrap;min-height:34px;
}
.strain-chip:active{border-color:var(--accent);color:var(--accent);}
.strain-chip .del{color:var(--fg-dim);margin-left:6px;}

/* analyze: research backlog */
#research-list{margin-bottom:10px;}
#research-list:empty{display:none;}
.research-head{font-size:10.5px;letter-spacing:.08em;color:var(--fg-dim);margin-bottom:6px;}
.research-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px;}
.research-row .rname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.research-row .rbar{width:74px;height:7px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:0 0 auto;}
.research-row .rbar > i{display:block;height:100%;background:var(--warn);}
.research-row .rcount{width:30px;text-align:right;color:var(--fg-dim);font-size:10.5px;flex:0 0 auto;}

/* observation report inside an event row */
.obs{margin-top:5px;padding-top:5px;border-top:1px dashed var(--line);font-size:11px;color:var(--fg-dim);}
.obs b{color:var(--fg);font-weight:600;}

/* inspect */
#inspect-body{flex:1;overflow-y:auto;padding:12px;}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.kv .k{color:var(--fg-dim);}
.trait-chip{
  display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);
  border-radius:14px;padding:4px 10px;margin:3px 4px 0 0;font-size:11.5px;
}
.extract-btn{width:100%;margin-top:12px;}

/* boot */
#boot-overlay{align-items:center;justify-content:center;z-index:50;background:radial-gradient(circle at 50% 30%,#0d1f18,#04080d 70%);}
.boot-card{text-align:center;padding:20px;max-width:360px;}
.boot-card h1{font-size:34px;letter-spacing:.12em;margin:0 0 4px;color:var(--accent);text-shadow:0 0 24px rgba(51,230,176,.5);}
.boot-card .tag{color:var(--fg-dim);margin:0 0 26px;}
.boot-card .hint{color:var(--fg-dim);font-size:11.5px;margin-top:20px;}
.boot-card .bigbtn{width:100%;margin:8px 0;}

@media (min-width:600px){
  #selection-panel.card{max-width:320px;}
  #designer-slots{grid-template-columns:repeat(6,1fr);}
}

/* world / colony roster */
#world-readout{margin-bottom:10px;}
#colony-roster{display:flex;flex-direction:column;gap:6px;}
.colony-row{
  display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;text-align:left;color:var(--fg);width:100%;min-height:44px;
}
.colony-row.dead{opacity:.45;}
.colony-row .swatch{width:12px;height:12px;border-radius:3px;flex:0 0 auto;}
.colony-row .cbody{flex:1;min-width:0;display:flex;flex-direction:column;}
.colony-row .cname{font-size:12.5px;font-weight:600;}
.colony-row .cname em{color:var(--fg-dim);font-style:normal;font-weight:400;}
.colony-row .cmeta{font-size:10.5px;color:var(--fg-dim);}
.colony-row .cint{font-size:11px;color:var(--danger);flex:0 0 auto;}
.event-row.rival{border-left:3px solid #a26bd6;}
.event-row.climate{border-left:3px solid #4fa9e0;}
#stat-climate{color:#9fd0e6;font-size:11.5px;}
#stat-climate span{white-space:nowrap;}

/* ---- transient sheets -------------------------------------------------
   Sheets slide up from the bottom and deliberately do NOT cover the world:
   the game stays visible and running above them, which is the whole reason
   they replaced full-screen overlays. Dismiss by tapping outside, swiping
   the grip down, or the close button. */
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:30;
  display:flex;flex-direction:column;
  max-height:52vh;
  background:rgba(11,20,29,.97);
  border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;
  box-shadow:0 -10px 30px rgba(0,0,0,.45);
  padding-bottom:var(--safe-bottom);
  transform:translateY(0);
  transition:transform .2s cubic-bezier(.2,.8,.3,1);
  touch-action:none;
}
.sheet.tall{max-height:82vh;}
.sheet.closing{transform:translateY(105%);}
.sheet-grip{
  flex:0 0 auto;width:40px;height:4px;border-radius:2px;background:var(--line);
  margin:8px auto 2px;
}
.sheet-head{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:4px 12px 8px;
  border-bottom:1px solid var(--line);
}
.sheet-title{flex:1;font-weight:800;letter-spacing:.06em;font-size:12.5px;color:var(--fg-dim);}
#inspect-body,#build-body{flex:1 1 auto;overflow-y:auto;padding:10px 12px;}

/* The catcher sits under the sheet but over the world, so a tap anywhere
   else closes it without dimming what the player is watching. */
#sheet-catcher{position:absolute;inset:0;z-index:29;background:transparent;}

@keyframes sheetin{from{transform:translateY(105%)}to{transform:translateY(0)}}
.sheet:not(.closing){animation:sheetin .2s cubic-bezier(.2,.8,.3,1);}

/* ---- build mode ---- */
#build-banner{
  position:absolute;left:10px;right:10px;top:10px;z-index:8;
  background:rgba(11,20,29,.95);border:1px solid var(--accent-dim);
  border-left:3px solid var(--accent);border-radius:10px;padding:9px 12px;
  font-size:12.5px;display:flex;align-items:center;gap:10px;
}
#build-banner .bb-text{flex:1;}
#build-banner .bb-text b{color:var(--accent);}
#build-banner button{
  background:var(--panel2);border:1px solid var(--line);color:var(--fg);
  border-radius:8px;min-height:32px;padding:0 10px;font-size:11.5px;
}

.build-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.depth-head{
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-size:10.5px;letter-spacing:.09em;color:var(--fg-dim);
  margin:12px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--line);
}
.depth-head span:first-child{font-weight:700;}
.build-card{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:9px 10px;text-align:left;color:var(--fg);min-height:70px;
}
.build-card:disabled{opacity:.4;}
.build-card.active{border-color:var(--accent);background:rgba(51,230,176,.09);}
.build-card .bc-top{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;}
.build-card .bc-cost{font-size:10.5px;color:var(--fg-dim);margin-top:3px;}
.build-card .bc-blurb{font-size:10.5px;color:var(--fg-dim);margin-top:4px;line-height:1.35;}
.build-list{display:flex;flex-direction:column;gap:5px;margin-top:10px;}
.build-row{display:flex;align-items:center;gap:8px;font-size:11.5px;background:var(--panel2);
  border:1px solid var(--line);border-radius:8px;padding:6px 9px;color:var(--fg);text-align:left;}
.build-row .br-bar{flex:1;height:6px;background:var(--panel);border-radius:3px;overflow:hidden;border:1px solid var(--line);}
.build-row .br-bar > i{display:block;height:100%;background:var(--accent);}

/* The designer sheet: one scrolling body, a pinned action row. */
#designer-scroll{flex:1 1 auto;overflow-y:auto;min-height:0;}
#designer-scroll #designer-preview{border-bottom:1px solid var(--line);}
#designer-scroll #preview-canvas{width:180px;height:180px;}
#designer-scroll #designer-stats{flex:none;overflow:visible;}
#designer-actions{flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel);}

</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div class="stat" id="stat-biomass" title="Biomass"><i>&#127793;</i><span>0</span></div>
    <div class="stat" id="stat-energy" title="Energy"><i>&#9889;</i><span>0</span></div>
    <div class="stat" id="stat-pop" title="Population"><i>&#129440;</i><span>0</span></div>
    <div class="stat" id="stat-climate" title="Season and weather"><i>&#127777;</i><span>—</span></div>
    <button id="btn-speed" class="iconbtn" title="Simulation speed">1x</button>
  </div>

  <div id="stage">
    <canvas id="world-canvas"></canvas>

    <div id="toast-layer"></div>

    <div id="selection-panel" class="card hidden"></div>

    <div id="cam-controls">
      <button id="btn-focus-core" class="roundbtn" title="Focus Core">&#8962;</button>
      <button id="btn-zoom-in" class="roundbtn" title="Zoom in">+</button>
      <button id="btn-zoom-out" class="roundbtn" title="Zoom out">&minus;</button>
    </div>

    <div id="depth-controls"></div>
    <div id="sanctum-meter" class="hidden"></div>

    <div id="directive-toast" class="hidden"></div>
  </div>

  <div id="tabs">
    <button data-tab="explore" class="tab active">EXPLORE</button>
    <button data-tab="analyze" class="tab">ANALYZE<span id="badge-analyze" class="badge hidden">0</span></button>
    <button data-tab="dna" class="tab">DNA<span id="badge-dna" class="badge hidden">!</span></button>
    <button data-tab="world" class="tab">WORLD</button>
  </div>

  <div id="panel-explore" class="panel active">
    <div id="selection-summary">Tap an organism to select it, or issue a directive to your whole colony.</div>
    <div id="directive-bar"></div>
    <button id="btn-open-build" class="bigbtn secondary" style="width:100%;margin:8px 0 0">&#9935; EXCAVATION</button>
  </div>

  <div id="panel-world" class="panel">
    <div id="world-readout"></div>
    <div id="colony-roster"></div>
  </div>

  <div id="panel-analyze" class="panel">
    <div id="research-list"></div>
    <div id="event-feed"></div>
  </div>

  <div id="designer-overlay" class="sheet tall hidden">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <div class="sheet-title">GENOME DESIGNER</div>
      <button id="btn-designer-close" class="iconbtn">&#10005;</button>
    </div>
    <!-- Everything except the action row scrolls together. The fixed-height
         preview and slot grid together can exceed the sheet, and with them
         all flex:0 0 auto the CREATE ORGANISM button was pushed off the
         bottom of the screen and became unclickable. -->
    <div id="designer-scroll">

    { id: 7, key: 'bloodcap', name: 'Bloodcap Fungus', nutrition: 2.0, regrowth: 0.02, toxicity: 0.85, thorns: 0,
      color: [172, 66, 74],
      biomes: ['MARSH', 'JUNGLE', 'TAIGA'] },

    { id: 8, key: 'lichen', name: 'Frost Lichen', nutrition: 0.8, regrowth: 0.006, toxicity: 0, thorns: 0,
      color: [168, 180, 168],
      biomes: ['TUNDRA', 'ICE', 'MOUNTAIN'] },

    { id: 9, key: 'reedmat', name: 'Reed Mat', nutrition: 1.15, regrowth: 0.026, toxicity: 0, thorns: 0,
      water: 14,
      color: [96, 148, 104],
      biomes: ['MARSH', 'SHALLOWS'] }
  ];

  const BY_ID = PLANTS;
  const BY_KEY = {};
  for (const p of PLANTS) BY_KEY[p.key] = p;

  // biome key -> candidate plant ids, built once
  const BY_BIOME = {};
  for (const p of PLANTS) {
    for (const b of p.biomes) (BY_BIOME[b] || (BY_BIOME[b] = [])).push(p.id);
  }

  function get(id) { return BY_ID[id] || BY_ID[0]; }
  function regrowthRate(id) { return (BY_ID[id] || BY_ID[0]).regrowth; }
  function isDefended(id) { const p = get(id); return p.toxicity > 0 || p.thorns > 0; }

  /* Assign a plant species and a food capacity to every cell. Which of a
   * biome's candidate species grows where is driven by low-frequency noise,
   * so species form patches a player can actually learn the shape of rather
   * than salt-and-pepper randomness. */
  function populate(world, seed) {
    const W = CM.world;
    const n = world.size * world.size;
    for (let y = 0; y < world.size; y++) {
      for (let x = 0; x < world.size; x++) {
        const i = W.idx(x, y);
        const info = W.BIOME_INFO[world.biome[i]];
        const candidates = BY_BIOME[info.key];
        if (!candidates || !candidates.length || info.foodCap <= 0) {
          world.flora[i] = 0; world.foodCap[i] = 0; world.food[i] = 0;
          continue;
        }
        // fbm rather than a single noise2 octave: raw value noise is
        // axis-aligned and paints visible vertical banding into the terrain.
        const pick = K.clamp01(K.fbm(seed + 9100, x * 0.045, y * 0.045, 3));
        const plant = candidates[Math.min(candidates.length - 1, Math.floor(pick * candidates.length))];
        world.flora[i] = plant;

        // Capacity blends the biome's ceiling with local moisture/warmth, so
        // the same biome is richer in its wetter, milder parts.
        const m = world.moisture[i];
        const t = K.clamp01(K.invLerp(-8, 30, world.temp[i]));
        const quality = 0.45 + m * 0.35 + t * 0.2;
        const cap = info.foodCap * quality;
        world.foodCap[i] = cap;
        world.food[i] = cap * (0.45 + 0.55 * K.clamp01(K.fbm(seed + 5000, x * 0.09, y * 0.09, 3)));
      }
    }
  }

  /* What eating one mouthful of this plant does. Nutrition scales the food
   * value; toxin and thorn damage are returned separately so the caller can
   * decide who resists them — that is where traits get to matter. */
  function biteOutcome(plantId, eater, amount) {
    const p = get(plantId);
    const food = amount * p.nutrition;
    let toxin = 0, physical = 0;
    if (p.toxicity > 0) {
      // Venom-producing organisms have the biochemistry to handle toxins;
      // this is the payoff for a trait that otherwise only does damage.
      const resist = eater.behaviors && eater.behaviors.has('damage_over_time') ? 0.25 : 1;
      toxin = p.toxicity * amount * 0.12 * resist;
    }
    if (p.thorns > 0) {
      // Armor is literally for this.
      const armor = K.clamp01((eater.stats.armor || 0) / 40);
      physical = p.thorns * amount * 0.10 * (1 - armor);
    }
    return { food, toxin, physical, water: (p.water || 0) * (amount / 16) };
  }

  CM.flora = {
    PLANTS, BY_KEY, get, regrowthRate, isDefended, populate, biteOutcome
  };
})(window.CM = window.CM || {});

<script>
/* Coremind — procedural world: a 256x256 cell ecosystem.
 *
 * Terrain is regenerated from the seed on every load and never saved, so
 * everything here must be deterministic given the same seed. What the player
 * *changed* (food levels, colonies, discoveries) lives in save.js.
 *
 * Generation runs as a pipeline of named stages, each drawing from its own
 * offset of the seed, so changing one stage's algorithm cannot silently
 * shift the output of the others.
 */
(function (CM) {
  'use strict';
  const K = CM.core;

  const SIZE = 256;

  /* Biome ids are append-only: they are written into save-adjacent code
   * paths and compared numerically all over the simulation. Insert new
   * biomes at the end, never in the middle. */
  const BIOME = {
    DEEP_WATER: 0, SHALLOWS: 1, MARSH: 2, BEACH: 3, DESERT: 4, SAVANNA: 5,
    GRASSLAND: 6, FOREST: 7, JUNGLE: 8, TAIGA: 9, TUNDRA: 10, ICE: 11,
    ROCK: 12, MOUNTAIN: 13
  };

  /* foodCap: peak plant biomass a cell of this biome can hold.
   * moveCost: multiplier on movement speed (1 = normal ground).
   * water:    can be drunk from / counts as open water.
   * shelter:  reduces how exposed an organism is to temperature swings. */
  const BIOME_INFO = [
    { id: 0,  key: 'DEEP_WATER', name: 'Deep Water', color: [22, 52, 84],   foodCap: 0,   moveCost: 0.35, water: true,  shelter: 0,    passable: true },
    { id: 1,  key: 'SHALLOWS',   name: 'Shallows',   color: [42, 96, 130],  foodCap: 14,  moveCost: 0.6,  water: true,  shelter: 0,    passable: true },
    { id: 2,  key: 'MARSH',      name: 'Marsh',      color: [64, 92, 66],   foodCap: 78,  moveCost: 0.7,  water: true,  shelter: 0.25, passable: true },
    { id: 3,  key: 'BEACH',      name: 'Sands',      color: [178, 162, 116],foodCap: 8,   moveCost: 0.9,  water: false, shelter: 0,    passable: true },
    { id: 4,  key: 'DESERT',     name: 'Desert',     color: [186, 148, 92], foodCap: 6,   moveCost: 0.95, water: false, shelter: 0,    passable: true },
    { id: 5,  key: 'SAVANNA',    name: 'Savanna',    color: [152, 152, 74], foodCap: 46,  moveCost: 1,    water: false, shelter: 0.1,  passable: true },
    { id: 6,  key: 'GRASSLAND',  name: 'Grassland',  color: [96, 142, 62],  foodCap: 84,  moveCost: 1,    water: false, shelter: 0.1,  passable: true },
    { id: 7,  key: 'FOREST',     name: 'Forest',     color: [52, 104, 54],  foodCap: 104, moveCost: 0.82, water: false, shelter: 0.45, passable: true },
    { id: 8,  key: 'JUNGLE',     name: 'Jungle',     color: [34, 92, 48],   foodCap: 128, moveCost: 0.68, water: false, shelter: 0.55, passable: true },
    { id: 9,  key: 'TAIGA',      name: 'Taiga',      color: [58, 88, 74],   foodCap: 58,  moveCost: 0.85, water: false, shelter: 0.4,  passable: true },
    { id: 10, key: 'TUNDRA',     name: 'Tundra',     color: [122, 128, 112],foodCap: 22,  moveCost: 0.92, water: false, shelter: 0.05, passable: true },
    { id: 11, key: 'ICE',        name: 'Ice Sheet',  color: [206, 218, 226],foodCap: 2,   moveCost: 0.75, water: false, shelter: 0,    passable: true },
    { id: 12, key: 'ROCK',       name: 'Rocky Waste',color: [104, 100, 96], foodCap: 10,  moveCost: 0.7,  water: false, shelter: 0.3,  passable: true },
    { id: 13, key: 'MOUNTAIN',   name: 'Mountains',  color: [140, 138, 140],foodCap: 0,   moveCost: 0.45, water: false, shelter: 0.35, passable: true }
  ];
  const BIOME_NAMES = BIOME_INFO.map(b => b.name);

  function isWaterBiome(b) { return BIOME_INFO[b] && BIOME_INFO[b].water; }

  // --- hazards -------------------------------------------------------------
  const HAZARD = { NONE: 0, THERMAL_VENT: 1, TOXIC_BOG: 2, HARD_FROST: 3 };
  const HAZARD_INFO = [
    null,
    { key: 'THERMAL_VENT', name: 'Thermal Vent', tempDelta: 26,  damage: 0.9, color: [214, 96, 48] },
    { key: 'TOXIC_BOG',    name: 'Toxic Bog',    tempDelta: 0,   damage: 1.6, color: [126, 176, 62] },
    { key: 'HARD_FROST',   name: 'Frost Hollow', tempDelta: -24, damage: 0.9, color: [150, 200, 224] }
  ];

  function idx(x, y) { return y * SIZE + x; }
  function inBounds(x, y) { return x >= 0 && y >= 0 && x < SIZE && y < SIZE; }

  // --- region naming -------------------------------------------------------
  const NAME_PREFIX = ['Ashen', 'Verdant', 'Hollow', 'Sunken', 'Pale', 'Bitter', 'Amber', 'Quiet',
    'Broken', 'Long', 'Deep', 'First', 'Salt', 'Iron', 'Glass', 'Low', 'Far', 'Old'];
  const NAME_SUFFIX = {
    DEEP_WATER: 'Deep', SHALLOWS: 'Shoal', MARSH: 'Fen', BEACH: 'Strand', DESERT: 'Waste',
    SAVANNA: 'Flats', GRASSLAND: 'Meadows', FOREST: 'Wood', JUNGLE: 'Tangle', TAIGA: 'Pinewood',
    TUNDRA: 'Barrens', ICE: 'Whiteness', ROCK: 'Scree', MOUNTAIN: 'Spine'
  };

  function regionName(rng, biomeId) {
    return NAME_PREFIX[Math.floor(rng() * NAME_PREFIX.length)] + ' ' + NAME_SUFFIX[BIOME_INFO[biomeId].key];
  }

  /* --- generation ---------------------------------------------------------
   * Elevation carves sea, land and highland. Moisture is elevation-biased so
   * basins are wetter, then rivers add moisture along their length.
   * Temperature follows a latitude band plus a lapse rate with altitude.
   * Biome is the joint classification of the three. */
  function generate(seed) {
    seed = (seed >>> 0) || 1;
    const n = SIZE * SIZE;

    const elevation = new Float32Array(n);
    const moisture = new Float32Array(n);
    const temp = new Float32Array(n);
    const biome = new Uint8Array(n);
    const food = new Float32Array(n);
    const foodCap = new Float32Array(n);
    const flora = new Uint8Array(n);
    const regionId = new Uint16Array(n);
    const river = new Uint8Array(n);
    const hazard = new Uint8Array(n);

    // stage 1: elevation ---------------------------------------------------
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        const i = idx(x, y);
        let e = K.fbm(seed, x * 0.018, y * 0.018, 5) * 0.7
              + K.fbm(seed + 1, x * 0.055, y * 0.055, 3) * 0.3;
        /* Raw fbm clusters hard around its midpoint, which leaves a map that
         * is half ocean and has no highland at all — every threshold above
         * ~0.75 goes unused. Stretching around a pivot below the mean widens
         * both tails, so the same noise yields real mountains and real deeps.
         * Measured over three seeds: ~25% water, ~65% habitable, ~10% highland. */
        e = K.clamp01(0.5 + (e - 0.45) * 1.7);
        // Pull the map's rim down so the playable landmass is enclosed by sea
        // rather than being cut off arbitrarily by the array bounds. Kept
        // narrow (10%) so the cold polar rows survive as land — a wider skirt
        // drowns them and the tundra/ice biomes never generate.
        const edge = Math.min(x, y, SIZE - 1 - x, SIZE - 1 - y) / (SIZE * 0.10);
        e *= K.clamp01(edge);
        elevation[i] = e;
      }
    }

    // stage 2: moisture + temperature --------------------------------------
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        const i = idx(x, y);
        const e = elevation[i];
        moisture[i] = K.clamp01(K.fbm(seed + 2000, x * 0.03, y * 0.03, 4) * 0.72 + (1 - e) * 0.28);
        const lat = Math.abs(y / SIZE - 0.5) * 2;             // 0 equator, 1 pole
        let t = K.lerp(34, -12, lat)
              + (K.fbm(seed + 4000, x * 0.045, y * 0.045, 3) - 0.5) * 12;
        t -= Math.max(0, e - 0.45) * 42;                      // lapse rate with altitude
        temp[i] = t;
      }
    }

    // stage 3: rivers -------------------------------------------------------
    const rngRiver = K.rngFrom(seed ^ 0x5bf03635);
    carveRivers(elevation, moisture, river, rngRiver);

    // stage 4: biome classification ----------------------------------------
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        const i = idx(x, y);
        biome[i] = classify(elevation[i], temp[i], moisture[i], river[i]);
      }
    }
    // Beaches read from the finished biome map, so they need their own pass.
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        const i = idx(x, y);
        const b = biome[i];
        if (b === BIOME.DESERT || b === BIOME.SAVANNA || b === BIOME.GRASSLAND || b === BIOME.TUNDRA) {
          if (elevation[i] < 0.38 && touchesDeepWater(biome, x, y)) biome[i] = BIOME.BEACH;
        }
      }
    }

    // stage 5: flora + food capacity ---------------------------------------
    const world = {
      seed, size: SIZE,
      elevation, moisture, temp, biome, food, foodCap, flora, regionId, river, hazard,
      foodCursor: 0,
      regions: [],
      hazards: [],
      deposits: [],
      veins: [],
      grid: makeSpatialGrid(SIZE, 6)
    };
    CM.flora.populate(world, seed);

    // stage 6: regions + derived fields -------------------------------------
    world.regions = buildRegions(world, K.rngFrom(seed ^ 0x27d4eb2f));
    buildWaterField(world);

    // stage 7: hazards + deposits ------------------------------------------
    placeHazards(world, K.rngFrom(seed ^ 0x165667b1));
    placeDeposits(world, K.rngFrom(seed ^ 0x9e3779b1));
    placeVeins(world, K.rngFrom(seed ^ 0x3b9aca07));

    world.coreSpawn = findColonySite(world, K.rngFrom(seed ^ 0x9e3779b9), []);
    return world;
  }

  function classify(e, t, m, isRiver) {
    if (e < 0.24) return BIOME.DEEP_WATER;
    if (e < 0.305) return BIOME.SHALLOWS;
    if (isRiver) return BIOME.SHALLOWS;
    if (e > 0.86) return BIOME.MOUNTAIN;
    if (e > 0.75) return BIOME.ROCK;
    if (e < 0.40 && m > 0.66 && t > 2) return BIOME.MARSH;
    if (t < -11) return BIOME.ICE;
    if (t < 1) return m > 0.46 ? BIOME.TAIGA : BIOME.TUNDRA;
    if (t < 12) return m > 0.58 ? BIOME.FOREST : (m > 0.32 ? BIOME.GRASSLAND : BIOME.TUNDRA);
    if (t < 25) {
      if (m > 0.66) return BIOME.FOREST;
      if (m > 0.4) return BIOME.GRASSLAND;
      if (m > 0.22) return BIOME.SAVANNA;
      return BIOME.DESERT;
    }
    if (m > 0.6) return BIOME.JUNGLE;
    if (m > 0.42) return BIOME.SAVANNA;
    return BIOME.DESERT;
  }

  function touchesDeepWater(biome, x, y) {
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const nx = x + dx, ny = y + dy;
        if (inBounds(nx, ny)) {
          const b = biome[idx(nx, ny)];
          if (b === BIOME.DEEP_WATER || b === BIOME.SHALLOWS) return true;
        }
      }
    }
    return false;
  }

  /* Rivers run from high ground to the sea by steepest descent, with a small
   * random nudge so they meander instead of drawing straight lines. They are
   * what makes the interior of a continent habitable: without them, every
   * inland region is a death sentence for anything that needs to drink. */
  function carveRivers(elevation, moisture, river, rng) {
    const RIVER_COUNT = 26, MAX_LEN = 420;
    for (let r = 0; r < RIVER_COUNT; r++) {
      // start somewhere high
      let sx = 0, sy = 0, bestE = -1;
      for (let tries = 0; tries < 40; tries++) {
        const x = 4 + Math.floor(rng() * (SIZE - 8));
        const y = 4 + Math.floor(rng() * (SIZE - 8));
        const e = elevation[idx(x, y)];
        if (e > bestE) { bestE = e; sx = x; sy = y; }
      }
      if (bestE < 0.5) continue;

      let x = sx, y = sy;
      for (let step = 0; step < MAX_LEN; step++) {
        const i = idx(x, y);
        if (elevation[i] < 0.305) break;   // reached the sea
        river[i] = 1;
        // widen the moisture influence around the channel
        for (let dy = -2; dy <= 2; dy++) {
          for (let dx = -2; dx <= 2; dx++) {
            const nx = x + dx, ny = y + dy;
            if (!inBounds(nx, ny)) continue;
            const d = Math.abs(dx) + Math.abs(dy);
            const j = idx(nx, ny);
            moisture[j] = K.clamp01(moisture[j] + (d <= 1 ? 0.3 : d <= 2 ? 0.16 : 0.07));
          }
        }
        // steepest descent among the 8 neighbours, with a little noise
        let nx = x, ny = y, bestScore = Infinity;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (!dx && !dy) continue;
            const cx = x + dx, cy = y + dy;
            if (!inBounds(cx, cy)) continue;
            const score = elevation[idx(cx, cy)] + (rng() - 0.5) * 0.02;
            if (score < bestScore) { bestScore = score; nx = cx; ny = cy; }
          }
        }
        if (nx === x && ny === y) break;          // local minimum: a lake
        if (bestScore >= elevation[i] + 0.004) break;
        x = nx; y = ny;
      }
    }
  }

  /* Contiguous same-biome areas become named regions. Small blobs are folded
   * into region 0 ("unremarkable ground") so the map has a handful of places
   * worth naming rather than thousands. */
  function buildRegions(world, rng) {
    const { biome, regionId } = world;
    const n = SIZE * SIZE;
    const MIN_REGION = 220;
    const regions = [{ id: 0, name: 'Uncharted', biome: BIOME.GRASSLAND, size: 0, cx: 0, cy: 0 }];
    const stack = new Int32Array(n);
    const visited = new Uint8Array(n);

    for (let start = 0; start < n; start++) {
      if (visited[start]) continue;
      const b = biome[start];
      let sp = 0, count = 0, sumX = 0, sumY = 0;
      stack[sp++] = start;
      visited[start] = 1;
      const cells = [];
      while (sp > 0) {
        const cur = stack[--sp];
        cells.push(cur);
        count++;
        sumX += cur % SIZE; sumY += (cur / SIZE) | 0;
        const cx = cur % SIZE, cy = (cur / SIZE) | 0;
        for (let d = 0; d < 4; d++) {
          const nx = cx + (d === 0 ? 1 : d === 1 ? -1 : 0);
          const ny = cy + (d === 2 ? 1 : d === 3 ? -1 : 0);
          if (!inBounds(nx, ny)) continue;
          const j = idx(nx, ny);
          if (visited[j] || biome[j] !== b) continue;
          visited[j] = 1;
          stack[sp++] = j;
        }
      }
      if (count >= MIN_REGION && regions.length < 64) {
        const id = regions.length;
        regions.push({ id, name: regionName(rng, b), biome: b, size: count, cx: sumX / count, cy: sumY / count });
        for (const c of cells) regionId[c] = id;
      }
    }
    return regions;
  }

  function placeHazards(world, rng) {
    const { biome, hazard, temp } = world;
    const wanted = 34;
    for (let placed = 0; placed < wanted; ) {
      const x = Math.floor(rng() * SIZE), y = Math.floor(rng() * SIZE);
      const i = idx(x, y);
      const b = biome[i];
      let kind = HAZARD.NONE;
      if (b === BIOME.ROCK || b === BIOME.MOUNTAIN) kind = HAZARD.THERMAL_VENT;
      else if (b === BIOME.MARSH || b === BIOME.JUNGLE) kind = HAZARD.TOXIC_BOG;
      else if (b === BIOME.ICE || b === BIOME.TUNDRA) kind = HAZARD.HARD_FROST;
      if (kind === HAZARD.NONE) continue;

      const radius = 2 + Math.floor(rng() * 3);
      for (let dy = -radius; dy <= radius; dy++) {
        for (let dx = -radius; dx <= radius; dx++) {
          if (dx * dx + dy * dy > radius * radius) continue;
          const nx = x + dx, ny = y + dy;
          if (!inBounds(nx, ny)) continue;
          hazard[idx(nx, ny)] = kind;
        }
      }
      world.hazards.push({ x: x + 0.5, y: y + 0.5, kind, radius, name: HAZARD_INFO[kind].name });
      placed++;
    }
  }

  /* Dense biomass deposits: the thing colonies actually compete over. Placed
   * only on productive land so contested ground is also ground worth living
   * on, rather than an arbitrary objective marker in a wasteland. */
  function placeDeposits(world, rng) {
    const wanted = 20;
    for (let placed = 0; placed < wanted; ) {
      const x = Math.floor(rng() * SIZE), y = Math.floor(rng() * SIZE);
      const i = idx(x, y);
      const b = world.biome[i];
      if (b !== BIOME.FOREST && b !== BIOME.JUNGLE && b !== BIOME.GRASSLAND && b !== BIOME.MARSH && b !== BIOME.SAVANNA) continue;
      if (world.hazard[i] !== HAZARD.NONE) continue;
      const richness = 60 + rng() * 140;
      world.deposits.push({
        id: 'dep_' + placed,
        x: x + 0.5, y: y + 0.5,
        richness,
        remaining: richness,
        claimedBy: null
      });
      placed++;
    }
  }

  /* Abyssal biomass veins. Unlike surface deposits these are invisible until
   * a colony digs deep near them, so the deep tier opens with prospecting
   * rather than with a shopping list. Placed on any diggable ground — the
   * best vein on a map may well be somewhere unpleasant to hold. */
  function placeVeins(world, rng) {
    world.veins = [];
    const wanted = 14;
    for (let placed = 0; placed < wanted; ) {
      const x = Math.floor(rng() * SIZE), y = Math.floor(rng() * SIZE);
      const i = idx(x, y);
      if (isWaterBiome(world.biome[i]) || world.biome[i] === BIOME.MOUNTAIN) continue;
      let tooClose = false;
      for (const v of world.veins) if (K.dist(v.x, v.y, x, y) < 26) { tooClose = true; break; }
      if (tooClose) continue;
      const richness = 900 + rng() * 1600;
      world.veins.push({
        id: 'vein_' + placed, x: x + 0.5, y: y + 0.5,
        richness, remaining: richness, known: false, claimedBy: null
      });
      placed++;
    }
  }

  /* Somewhere a colony can actually live: productive, temperate, near water,
   * and away from every site already taken. Used for the player's Core and
   * for every rival. */
  function findColonySite(world, rng, avoid) {
    let best = null, bestScore = -Infinity;
    for (let tries = 0; tries < 900; tries++) {
      const x = K.rndInt(rng, 12, SIZE - 12);
      const y = K.rndInt(rng, 12, SIZE - 12);
      const i = idx(x, y);
      const b = world.biome[i];
      if (b !== BIOME.GRASSLAND && b !== BIOME.FOREST && b !== BIOME.SAVANNA && b !== BIOME.JUNGLE && b !== BIOME.MARSH) continue;
      if (world.hazard[i] !== HAZARD.NONE) continue;

      const t = world.temp[i];
      let score = -Math.abs(t - 18) * 0.6 + world.foodCap[i] * 0.06;

      let nearWater = false;
      for (let dy = -4; dy <= 4 && !nearWater; dy++) {
        for (let dx = -4; dx <= 4; dx++) {
          const nx = x + dx, ny = y + dy;
          if (inBounds(nx, ny) && isWaterBiome(world.biome[idx(nx, ny)])) { nearWater = true; break; }
        }
      }
      if (!nearWater) continue;      // a colony without water is not a colony
      score += 6;

      let tooClose = false;
      for (const a of avoid) {
        const d = K.dist(x, y, a.x, a.y);
        if (d < 55) { tooClose = true; break; }
        score += Math.min(12, d * 0.04);
      }
      if (tooClose) continue;

      if (score > bestScore) { bestScore = score; best = { x: x + 0.5, y: y + 0.5 }; }
    }
    // Relax the spacing rule rather than fail outright on a cramped map.
    if (!best && avoid.length) return findColonySite(world, rng, avoid.slice(0, -1));
    return best || { x: SIZE / 2, y: SIZE / 2 };
  }

  // --- lookups --------------------------------------------------------------
  function biomeAt(world, x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    if (!inBounds(xi, yi)) return BIOME.DEEP_WATER;
    return world.biome[idx(xi, yi)];
  }
  function biomeInfoAt(world, x, y) { return BIOME_INFO[biomeAt(world, x, y)]; }
  function isWaterAt(world, x, y) { return isWaterBiome(biomeAt(world, x, y)); }
  function moveCostAt(world, x, y) { return BIOME_INFO[biomeAt(world, x, y)].moveCost; }

  function hazardAt(world, x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    if (!inBounds(xi, yi)) return HAZARD.NONE;
    return world.hazard[idx(xi, yi)];
  }

  /* Effective temperature, including the local hazard's contribution and the
   * shelter a dense biome gives against it. */
  function tempAt(world, x, y) {
    const xi = K.clamp(Math.floor(x), 0, SIZE - 1), yi = K.clamp(Math.floor(y), 0, SIZE - 1);
    const i = idx(xi, yi);
    let t = world.temp[i] + (world.climateOffset || 0);
    const hz = world.hazard[i];
    if (hz) t += HAZARD_INFO[hz].tempDelta;
    const shelter = BIOME_INFO[world.biome[i]].shelter;
    // Shelter pulls the local reading back toward the comfortable middle.
    if (shelter > 0) t = K.lerp(t, 19, shelter * 0.45);
    return t;
  }

  function moistureAt(world, x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    if (!inBounds(xi, yi)) return 0;
    return world.moisture[idx(xi, yi)];
  }
  function foodAt(world, x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    if (!inBounds(xi, yi)) return 0;
    return world.food[idx(xi, yi)];
  }
  function regionAt(world, x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    if (!inBounds(xi, yi)) return world.regions[0];
    return world.regions[world.regionId[idx(xi, yi)]] || world.regions[0];
  }

  function consumeFood(world, x, y, amount) {
    const xi = Math.floor(x), yi = Math.floor(y);
    if (!inBounds(xi, yi)) return 0;
    const i = idx(xi, yi);
    const taken = Math.min(world.food[i], amount);
    world.food[i] -= taken;
    return taken;
  }

  /* Regrowth runs on a rolling cursor rather than a full 65k sweep, so cost
   * per call is bounded. Rate is scaled by the current climate so a drought
   * genuinely starves the map. */
  function tickFood(world, batchSize) {
    const n = world.food.length;
    const growth = world.growthScale == null ? 1 : world.growthScale;
    let c = world.foodCursor;
    for (let k = 0; k < batchSize; k++) {
      const i = c;
      const cap = world.foodCap[i];
      if (cap > 0) {
        const rate = CM.flora.regrowthRate(world.flora[i]) * growth;
        world.food[i] += (cap - world.food[i]) * rate;
        if (world.food[i] < 0.01) world.food[i] = 0;
        else if (world.food[i] > cap) world.food[i] = cap;
      }
      c = (c + 1) % n;
    }
    world.foodCursor = c;
  }

  /* avoidDefended: skip toxic/thorned species. Animals do not graze poison
   * when there is anything else going, and without this a colony that spawns
   * in a bitterleaf forest quietly poisons itself to death while its hunger
   * and thirst read perfectly normal — which is indistinguishable, from the
   * outside, from a bug. Desperation overrides it (see the caller), so the
   * defended plants still matter; they are just no longer a silent trap. */
  function findNearestFood(world, x, y, radius, minAmount, avoidDefended) {
    const xi = Math.floor(x), yi = Math.floor(y);
    let best = null, bestD = Infinity;
    let fallback = null, fallbackD = Infinity;
    const r = Math.ceil(radius);
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const nx = xi + dx, ny = yi + dy;
        if (!inBounds(nx, ny)) continue;
        const d2 = dx * dx + dy * dy;
        if (d2 > radius * radius) continue;
        const i = idx(nx, ny);
        if (world.food[i] < minAmount) continue;
        const defended = avoidDefended && CM.flora.isDefended(world.flora[i]);
        if (defended) {
          if (d2 < fallbackD) { fallbackD = d2; fallback = { x: nx + 0.5, y: ny + 0.5, amount: world.food[i], flora: world.flora[i] }; }
          continue;
        }
        if (d2 < bestD) { bestD = d2; best = { x: nx + 0.5, y: ny + 0.5, amount: world.food[i], flora: world.flora[i] }; }
      }
    }
    // Nothing safe within reach: a defended plant beats starving.
    return best || fallback;
  }

  /* Nearest-water is a multi-source BFS computed once at generation, storing
   * the index of the closest water cell for every cell on the map.
   *
   * It was previously a live radial scan, and because the thirst search
   * widens with desperation it reached a 77x77 sweep per thirsty organism per
   * decision — 46% of total simulation time, measured. Water is static
   * terrain, so paying for it once at load turns the query into a lookup. */
  /* 8SSEDT (Danielsson): two sweeps propagating the *vector* to the nearest
   * water cell, comparing true squared distance at every step.
   *
   * A plain 8-connected BFS was tried first and is wrong in a way that
   * matters: it spreads by hop count, i.e. Chebyshev distance, so a cell
   * whose real nearest water lies along a diagonal gets pointed at a
   * different source entirely. Measured against brute force it overshot by
   * up to 10 cells on a 34-cell true distance — a 30% error, paid by exactly
   * the organism least able to afford it, the one already dying of thirst.
   * This version's error against brute force is zero on the same sample. */
  function buildWaterField(world) {
    const n = SIZE * SIZE;
    const FAR = 30000;
    const dx = new Int16Array(n).fill(FAR);
    const dy = new Int16Array(n).fill(FAR);

    for (let i = 0; i < n; i++) {
      if (isWaterBiome(world.biome[i])) { dx[i] = 0; dy[i] = 0; }
    }

    const d2 = i => {
      const a = dx[i], b = dy[i];
      return a >= FAR || b >= FAR ? Infinity : a * a + b * b;
    };
    function relax(i, j, sx, sy) {
      if (dx[j] >= FAR) return;
      const nx = dx[j] + sx, ny = dy[j] + sy;
      if (nx * nx + ny * ny < d2(i)) { dx[i] = nx; dy[i] = ny; }
    }

    // forward sweep: from the top-left
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        const i = idx(x, y);
        if (y > 0) relax(i, i - SIZE, 0, 1);
        if (x > 0) relax(i, i - 1, 1, 0);
        if (x > 0 && y > 0) relax(i, i - SIZE - 1, 1, 1);
        if (x < SIZE - 1 && y > 0) relax(i, i - SIZE + 1, -1, 1);
      }
      for (let x = SIZE - 2; x >= 0; x--) relax(idx(x, y), idx(x + 1, y), -1, 0);
    }
    // backward sweep: from the bottom-right
    for (let y = SIZE - 1; y >= 0; y--) {
      for (let x = SIZE - 1; x >= 0; x--) {
        const i = idx(x, y);
        if (y < SIZE - 1) relax(i, i + SIZE, 0, -1);
        if (x < SIZE - 1) relax(i, i + 1, -1, 0);
        if (x < SIZE - 1 && y < SIZE - 1) relax(i, i + SIZE + 1, -1, -1);
        if (x > 0 && y < SIZE - 1) relax(i, i + SIZE - 1, 1, -1);
      }
      for (let x = 1; x < SIZE; x++) relax(idx(x, y), idx(x - 1, y), 1, 0);
    }

    // Collapse the vectors into the source cell index each one points at.
    const nearest = new Int32Array(n).fill(-1);
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        const i = idx(x, y);
        if (dx[i] >= FAR) continue;
        const sx = x - dx[i], sy = y - dy[i];
        if (sx >= 0 && sy >= 0 && sx < SIZE && sy < SIZE) nearest[i] = idx(sx, sy);
      }
    }
    world.nearestWater = nearest;
  }

  function findNearestWater(world, x, y, radius) {
    const xi = K.clamp(Math.floor(x), 0, SIZE - 1), yi = K.clamp(Math.floor(y), 0, SIZE - 1);
    const field = world.nearestWater;
    if (!field) return null;
    const src = field[idx(xi, yi)];
    if (src < 0) return null;                       // a map with no water at all
    const wx = (src % SIZE) + 0.5, wy = ((src / SIZE) | 0) + 0.5;
    return K.dist(x, y, wx, wy) <= radius ? { x: wx, y: wy } : null;
  }

  /* Deposits are concentrated biomass — worth far more than grazing, finite,
   * and slow to recover, which is what makes them worth fighting over rather
   * than merely worth visiting. */
  const DEPOSIT_REACH = 2.2;
  function findNearestDeposit(world, x, y, radius) {
    let best = null, bestD = radius * radius;
    for (const d of world.deposits) {
      if (d.remaining <= 1) continue;
      const dd = K.dist2(d.x, d.y, x, y);
      if (dd < bestD) { bestD = dd; best = d; }
    }
    return best;
  }
  function harvestDeposit(deposit, amount) {
    const taken = Math.min(deposit.remaining, amount);
    deposit.remaining -= taken;
    return taken;
  }
  /* Regrowth is slow enough that a stripped deposit stays stripped for a
   * meaningful stretch, so exhausting one has consequences. */
  function tickDeposits(world, dt) {
    for (const d of world.deposits) {
      if (d.remaining < d.richness) d.remaining = Math.min(d.richness, d.remaining + d.richness * 0.004 * dt);
    }
  }

  function atWaterEdge(world, x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const nx = xi + dx, ny = yi + dy;
        if (inBounds(nx, ny) && isWaterBiome(world.biome[idx(nx, ny)])) return true;
      }
    }
    return false;
  }

  // --- uniform spatial grid for organisms / samples -------------------------
  function makeSpatialGrid(worldSize, cellSize) {
    const cols = Math.ceil(worldSize / cellSize);
    const buckets = new Map();
    const key = (cx, cy) => cx * 100000 + cy;

    function bucketOf(x, y) { return [Math.floor(x / cellSize), Math.floor(y / cellSize)]; }
    function insert(entity) {
      const [cx, cy] = bucketOf(entity.x, entity.y);
      entity.__gx = cx; entity.__gy = cy;
      const k = key(cx, cy);
      let b = buckets.get(k);
      if (!b) { b = new Set(); buckets.set(k, b); }
      b.add(entity);
    }
    function remove(entity) {
      const k = key(entity.__gx, entity.__gy);
      const b = buckets.get(k);
      if (b) { b.delete(entity); if (b.size === 0) buckets.delete(k); }
    }
    function update(entity) {
      const [cx, cy] = bucketOf(entity.x, entity.y);
      if (cx === entity.__gx && cy === entity.__gy) return;
      remove(entity);
      insert(entity);
    }
    function queryRadius(x, y, radius, out) {
      out = out || [];
      const r = Math.ceil(radius / cellSize);
      const [cx, cy] = bucketOf(x, y);
      const r2 = radius * radius;
      for (let gy = cy - r; gy <= cy + r; gy++) {
        for (let gx = cx - r; gx <= cx + r; gx++) {
          const b = buckets.get(key(gx, gy));
          if (!b) continue;
          for (const e of b) if (K.dist2(e.x, e.y, x, y) <= r2) out.push(e);
        }
      }
      return out;
    }
    function queryBox(minX, minY, maxX, maxY, out) {
      out = out || [];
      const [cx0, cy0] = bucketOf(minX, minY);
      const [cx1, cy1] = bucketOf(maxX, maxY);
      for (let gy = cy0; gy <= cy1; gy++) {
        for (let gx = cx0; gx <= cx1; gx++) {
          const b = buckets.get(key(gx, gy));
          if (!b) continue;
          for (const e of b) out.push(e);
        }
      }
      return out;
    }
    function clear() { buckets.clear(); }
    return { cellSize, insert, remove, update, queryRadius, queryBox, clear };
  }

  CM.world = {
    SIZE, BIOME, BIOME_INFO, BIOME_NAMES, HAZARD, HAZARD_INFO, idx, inBounds,
    generate, classify, findColonySite,
    biomeAt, biomeInfoAt, isWaterBiome, isWaterAt, moveCostAt, hazardAt,
    tempAt, moistureAt, foodAt, regionAt, consumeFood, tickFood,
    findNearestFood, findNearestWater, findNearestDeposit, harvestDeposit, tickDeposits,
    DEPOSIT_REACH, atWaterEdge, makeSpatialGrid
  };
})(window.CM = window.CM || {});

<script>
/* Coremind — organism instances: factory, object pool, and the pure stat/
 * comfort math shared by simulation and AI. No per-species behaviour lives
 * here — see ai.js for the reusable state machine every organism runs.
 */
(function (CM) {
  'use strict';
  const K = CM.core;
  const T = CM.traits;

  /* SEEK_WATER is the one state beyond the brief's list. The brief calls that
   * list "possible states", and water_requirement is a required stat — without
   * somewhere for a thirsty organism to go, that stat could only ever be a
   * hidden death sentence rather than a design decision the player can answer. */
  const AI_STATE = {
    IDLE: 'IDLE', EXPLORE: 'EXPLORE', SEEK_FOOD: 'SEEK_FOOD', SEEK_WATER: 'SEEK_WATER',
    FLEE: 'FLEE', HUNT: 'HUNT', ATTACK: 'ATTACK', REST: 'REST',
    RETURN_TO_CORE: 'RETURN_TO_CORE', REPRODUCE: 'REPRODUCE', INVESTIGATE: 'INVESTIGATE',
    // The underground states. EXCAVATE is the work itself; SHELTER is taking
    // cover in something already dug.
    EXCAVATE: 'EXCAVATE', SHELTER: 'SHELTER'
  };

  const DIRECTIVES = ['EXPLORE', 'GATHER', 'HUNT', 'DEFEND', 'REPRODUCE', 'INVESTIGATE', 'RETURN',
    'DIG', 'SHELTER', 'EXPAND'];

  const pool = [];

  function acquire() {
    return pool.pop() || {
      id: null, ownerId: null, speciesId: null, designId: null, name: '',
      generation: 1, age: 0, x: 0, y: 0, heading: 0,
      stats: null, traits: null, behaviors: null, diet: 'herbivore',
      health: 1, energy: 1, hunger: 0, thirst: 0, burrowed: false, burrowTimer: 0,
      state: AI_STATE.IDLE, stateTimer: 0, directive: null,
      target: null, carrying: 0, alive: true, lod: 'near', selected: false,
      visualSeed: 0, lastEventAt: 0, __gx: 0, __gy: 0
    };
  }

  function release(org) {
    org.alive = false;
    org.target = null;
    pool.push(org);
  }

  let nextId = 1;

  /* traitIds: array (nulls for empty slots are fine, filtered here). */
  function create(opts) {
    const org = acquire();
    const traitIds = (opts.traits || []).filter(Boolean);
    const stats = T.resolveStats(traitIds);
    org.id = 'org_' + (nextId++);
    org.ownerId = opts.ownerId || 'wild';
    org.speciesId = opts.speciesId || null;
    org.designId = opts.designId || null;
    org.name = opts.name || (opts.speciesId ? T.WILD_BY_ID[opts.speciesId].name : 'Organism');
    org.generation = opts.generation || 1;
    org.age = 0;
    org.x = opts.x; org.y = opts.y;
    org.heading = opts.heading != null ? opts.heading : Math.random() * Math.PI * 2;
    org.stats = stats;
    org.traits = traitIds;
    org.behaviors = T.behaviorModifiers(traitIds);
    org.diet = opts.diet || (opts.ownerId === 'player' ? 'omnivore' : 'herbivore');
    org.health = stats.health;
    org.energy = stats.energyMax;
    org.hunger = 0;
    org.thirst = 0;
    org.burrowed = false;
    org.burrowTimer = 0;
    org.burrowCooldown = 0;
    org.sheltered = false;
    org.state = AI_STATE.IDLE;
    org.stateTimer = 0;
    org.directive = opts.directive || null;
    org.directiveTarget = null;
    org.rallyPoint = null;
    org.target = null;
    org.actionTarget = null;
    org.carrying = 0;
    // A random maturation delay before an organism is first eligible to
    // reproduce. Without this every organism in the starting population
    // begins at full health/energy with nothing else to do, so they all
    // enter REPRODUCE on their very first AI decision — a synchronized
    // birth spike a few seconds later, rather than a population that grows
    // gradually and staggers itself the way reproCooldown does afterward.
    org.reproCooldown = 5 + Math.random() * 28;
    org.reproTimer = null;
    org.huntTimer = 0;
    org.aiCounter = 0;
    org.__attackedThisTick = false;
    org.alive = true;
    org.lod = 'near';
    org.selected = false;
    org.visualSeed = (opts.visualSeed != null ? opts.visualSeed : Math.floor(Math.random() * 1e9));
    org.color = opts.color || (opts.ownerId === 'player' ? '#33e6b0' : (T.WILD_BY_ID[opts.speciesId] || {}).color || '#cccccc');
    return org;
  }

  /* 0 (dead center of comfort) .. 1 (right at the edge of tolerance) .. >1
   * (out of range, taking damage). temperature_tolerance is a +/- half-width
   * band around a fixed species-neutral comfort point. */
  const COMFORT_TEMP = 19;
  function tempStress(org, worldTemp) {
    const band = org.stats.temperature_tolerance;
    const d = Math.abs(worldTemp - COMFORT_TEMP);
    return d / band; // <=1 fine, >1 stressed
  }

  function isAlive(org) { return org.alive && org.health > 0; }

  CM.organism = { AI_STATE, DIRECTIVES, create, release, isAlive, tempStress, COMFORT_TEMP };
})(window.CM = window.CM || {});
